# Runs the suite on three operating systems and four interpreters. There is
# no install step on purpose: that absence is the proof that the checker and
# the suite need nothing beyond a standard Python.
name: test

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday 06:17 UTC: the fixtures are clock-driven, so drift surfaces without a push
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.10', '3.12', '3.x']
        # Every cell resolves in the actions/python-versions manifest as read
        # on 2026-09-08: '3.8' lands as 3.8.10 on macos-latest (arm64) and on
        # windows-latest, and as 3.8.18 on ubuntu-latest. The x64 macos-13
        # image is no longer offered by GitHub-hosted runners, so 3.8 on macOS
        # runs on the arm64 image rather than through an exclude/include pair.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/test.py
